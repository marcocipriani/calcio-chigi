name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:import
      - run: npm run test:sync

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # Solo Postgres, Auth e Storage: le migrazioni toccano auth.users e storage.buckets.
      - run: supabase start -x studio,imgproxy,mailpit,logflare,vector,edge-runtime,supavisor,realtime,postgres-meta

      - run: supabase test db tests/db

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - run: npm ci

      # Desktop Chrome e iPhone 13 (WebKit), come i due progetti di playwright.config.ts.
      - run: npx playwright install --with-deps chromium webkit

      # Il realtime serve: home, evento e modalità partita si aggiornano da lì.
      - run: supabase start -x studio,imgproxy,mailpit,logflare,vector,edge-runtime,supavisor

      # playwright.config.ts legge queste al posto di `npx supabase status`.
      - name: Chiavi del Supabase locale
        run: |
          eval "$(supabase status -o env)"
          {
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
